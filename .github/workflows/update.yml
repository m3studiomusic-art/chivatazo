name: Actualizar precios

on:
  schedule:
    - cron: '30 4 * * *'   # cada mañana: precios + publicación en Telegram
    - cron: '45 18 * * *'  # cada tarde, cuando ya está la luz de mañana
  workflow_dispatch:        # botón para ejecutarlo a mano
    inputs:
      publicar:
        description: 'Publicar también en Telegram'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - name: Publicar en Telegram
        if: github.event.schedule == '30 4 * * *' || inputs.publicar
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FORCE: ${{ inputs.publicar }}
        run: node scripts/telegram.mjs
      - run: |
          git config user.name "chivatazo-bot"
          git config user.email "bot@chivatazo.es"
          git add data
          git diff --cached --quiet || git commit -m "Precios $(date -u +%F-%H%M)"
          git pull --rebase -X theirs origin main
          git push
