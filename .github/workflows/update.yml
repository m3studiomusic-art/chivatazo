name: Actualizar precios

on:
  schedule:
    - cron: '15 5 * * *'   # cada mañana (07:15 en verano, 06:15 en invierno)
    - cron: '45 18 * * *'  # cada tarde, cuando ya está la luz de mañana
  workflow_dispatch:        # botón para ejecutarlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - run: |
          git config user.name "chivatazo-bot"
          git config user.email "bot@chivatazo.es"
          git add data
          git diff --cached --quiet || git commit -m "Precios $(date -u +%F-%H%M)"
          git pull --rebase -X theirs origin main
          git push
